<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" role="img" aria-labelledby="title desc">
  <title id="title">Objetos urbanos OSM no comerciales heredados por tarjetas QR vs BIP</title>
  <desc id="desc">Barras divergentes con la diferencia QR menos BIP en la mediana del indice z heredado para escuelas, salud, parques y otros objetos urbanos registrados en OpenStreetMap.</desc>
  <rect width="1400" height="820" fill="#F7F2E8"/>
  <text x="700" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1F2933">Objetos urbanos OSM no comerciales heredados por tarjetas QR vs BIP</text>
  <text x="700" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6F6A61">Filas = tipo de objeto registrado en OpenStreetMap; barras = QR - BIP en la mediana del indice zonal.</text>

  <text x="460" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1F2933">Residencia</text>
  <text x="460" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F6A61">zona_hogar de la tarjeta</text>
  <text x="1030" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1F2933">Origen habitual</text>
  <text x="1030" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6F6A61">zona donde la tarjeta suele iniciar viajes</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F6A61">
    <text x="320" y="646" text-anchor="middle">-0.10</text>
    <text x="390" y="646" text-anchor="middle">-0.05</text>
    <text x="460" y="646" text-anchor="middle">0</text>
    <text x="530" y="646" text-anchor="middle">+0.05</text>
    <text x="600" y="646" text-anchor="middle">+0.10</text>
    <text x="890" y="646" text-anchor="middle">-0.10</text>
    <text x="960" y="646" text-anchor="middle">-0.05</text>
    <text x="1030" y="646" text-anchor="middle">0</text>
    <text x="1100" y="646" text-anchor="middle">+0.05</text>
    <text x="1170" y="646" text-anchor="middle">+0.10</text>
  </g>
  <text x="460" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1F2933">QR - BIP en mediana del indice z</text>
  <text x="1030" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1F2933">QR - BIP en mediana del indice z</text>

  <g stroke="#DED6C8" stroke-width="1">
    <line x1="320" y1="205" x2="320" y2="620"/>
    <line x1="390" y1="205" x2="390" y2="620"/>
    <line x1="530" y1="205" x2="530" y2="620"/>
    <line x1="600" y1="205" x2="600" y2="620"/>
    <line x1="890" y1="205" x2="890" y2="620"/>
    <line x1="960" y1="205" x2="960" y2="620"/>
    <line x1="1100" y1="205" x2="1100" y2="620"/>
    <line x1="1170" y1="205" x2="1170" y2="620"/>
  </g>
  <g stroke="#B8B1A4" stroke-width="2">
    <line x1="460" y1="205" x2="460" y2="620"/>
    <line x1="1030" y1="205" x2="1030" y2="620"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#1F2933">
    <text x="72" y="224" font-size="17" font-weight="700">Escuelas</text>
    <text x="72" y="243" font-size="13" fill="#6F6A61">colegios registrados</text>
    <text x="72" y="284" font-size="17" font-weight="700">Educacion superior</text>
    <text x="72" y="303" font-size="13" fill="#6F6A61">universidades / institutos</text>
    <text x="72" y="344" font-size="17" font-weight="700">Salud general</text>
    <text x="72" y="363" font-size="13" fill="#6F6A61">clinicas, consultas, dentistas</text>
    <text x="72" y="404" font-size="17" font-weight="700">Centros civicos</text>
    <text x="72" y="423" font-size="13" fill="#6F6A61">centros comunitarios</text>
    <text x="72" y="464" font-size="17" font-weight="700">Parques</text>
    <text x="72" y="483" font-size="13" fill="#6F6A61">areas verdes registradas</text>
    <text x="72" y="524" font-size="17" font-weight="700">Juegos infantiles</text>
    <text x="72" y="543" font-size="13" fill="#6F6A61">plazas de juego</text>
    <text x="72" y="584" font-size="17" font-weight="700">Canchas / deporte</text>
    <text x="72" y="603" font-size="13" fill="#6F6A61">canchas / centros deportivos</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
    <rect x="460" y="211" width="28" height="24" fill="#D76242" opacity="0.9"/>
    <text x="496" y="229" fill="#D76242">+0.02 z</text>
    <circle cx="460" cy="283" r="5" fill="#6F6A61"/>
    <text x="472" y="289" fill="#6F6A61">+0.00 z</text>
    <rect x="460" y="331" width="140" height="24" fill="#D76242" opacity="0.9"/>
    <text x="608" y="349" fill="#D76242">+0.10 z</text>
    <circle cx="460" cy="403" r="5" fill="#6F6A61"/>
    <text x="472" y="409" fill="#6F6A61">+0.00 z</text>
    <circle cx="460" cy="463" r="5" fill="#6F6A61"/>
    <text x="472" y="469" fill="#6F6A61">+0.00 z</text>
    <rect x="460" y="511" width="14" height="24" fill="#D76242" opacity="0.9"/>
    <text x="482" y="529" fill="#D76242">+0.01 z</text>
    <rect x="404" y="571" width="56" height="24" fill="#1F5A7A" opacity="0.9"/>
    <text x="394" y="589" text-anchor="end" fill="#1F5A7A">-0.04 z</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
    <rect x="1030" y="211" width="28" height="24" fill="#D76242" opacity="0.9"/>
    <text x="1066" y="229" fill="#D76242">+0.02 z</text>
    <circle cx="1030" cy="283" r="5" fill="#6F6A61"/>
    <text x="1042" y="289" fill="#6F6A61">+0.00 z</text>
    <rect x="1030" y="331" width="154" height="24" fill="#D76242" opacity="0.9"/>
    <text x="1192" y="349" fill="#D76242">+0.11 z</text>
    <circle cx="1030" cy="403" r="5" fill="#6F6A61"/>
    <text x="1042" y="409" fill="#6F6A61">+0.00 z</text>
    <rect x="1016" y="451" width="14" height="24" fill="#1F5A7A" opacity="0.9"/>
    <text x="1006" y="469" text-anchor="end" fill="#1F5A7A">-0.01 z</text>
    <rect x="1030" y="511" width="126" height="24" fill="#D76242" opacity="0.9"/>
    <text x="1164" y="529" fill="#D76242">+0.09 z</text>
    <rect x="1002" y="571" width="28" height="24" fill="#1F5A7A" opacity="0.9"/>
    <text x="992" y="589" text-anchor="end" fill="#1F5A7A">-0.02 z</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16">
    <rect x="395" y="720" width="18" height="18" fill="#D76242" opacity="0.9"/>
    <text x="422" y="735" fill="#1F2933">QR mayor que BIP</text>
    <rect x="585" y="720" width="18" height="18" fill="#1F5A7A" opacity="0.9"/>
    <text x="612" y="735" fill="#1F2933">BIP mayor que QR</text>
    <circle cx="785" cy="729" r="5" fill="#6F6A61"/>
    <text x="800" y="735" fill="#1F2933">diferencia aprox. cero</text>
  </g>
  <text x="700" y="772" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F6A61">Nota: cada componente usa densidad zonal de esos objetos OSM por km2, transformada con log1p, winsor p99.5 y z-score.</text>
  <text x="700" y="795" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6F6A61">La variable se hereda desde residencia u origen habitual; no mide uso, calidad ni acceso individual.</text>
</svg>
